[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-bootstrap"
version = "0.1.0"
description = "Modular bootstrap for guided Spec-Driven Development workflows"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
tui = ["textual"]

[project.scripts]
ai-workflow-bootstrap = "ai_workflow_bootstrap.cli:main"
ai-bootstrap = "ai_workflow_bootstrap.cli:main"

[tool.setuptools]
py-modules = ["bootstrap_sdd"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ai_workflow_bootstrap*"]

[tool.setuptools.package-data]
"ai_workflow_bootstrap.template_packs.default" = ["manifest.json", "templates/**/*"]
