[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-bootstrap"
version = "0.1.0"
description = "Modular bootstrap for guided Spec-Driven Development workflows"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["bootstrap_sdd"]

[tool.setuptools.packages.find]
include = ["ai_workflow_bootstrap*"]

